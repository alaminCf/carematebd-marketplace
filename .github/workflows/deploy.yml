name: Deploy to CareMate BD Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Sync Files & Clear View Cache via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Upload changed files and clear compiled Blade views
        id: ftp_sync
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || vars.FTP_HOST || 'drh3.hostwhitelabel.com' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME || 'techbolo' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          REMOTE_BASE: /domains/carematebd.com
        run: |
          python3 -u - << 'EOF' > /tmp/deploy.log 2>&1
          import ftplib
          import os
          import subprocess
          import sys
          import traceback

          host = (os.environ.get('FTP_HOST') or '').strip() or 'drh3.hostwhitelabel.com'
          user = (os.environ.get('FTP_USERNAME') or '').strip()
          password = (os.environ.get('FTP_PASSWORD') or '').strip()
          remote_base = (os.environ.get('REMOTE_BASE') or '/domains/carematebd.com').strip()

          print(f"Starting deploy to {host}:{remote_base} (user set: {bool(user)}, pass set: {bool(password)})")

          if not user or not password:
              print("ERROR: FTP_USERNAME or FTP_PASSWORD secret is empty!")
              sys.exit(1)

          try:
              changed = subprocess.check_output(['git', 'diff', '--name-only', 'ce33c7a', 'HEAD'], text=True).splitlines()
          except Exception:
              changed = []

          core_sync = [
              'app/Http/Controllers/Admin/AdminSettingController.php',
              'app/Models/Setting.php',
              'app/Providers/AppServiceProvider.php',
              'resources/views/admin/settings/index.blade.php',
              'resources/views/admin/contact-messages/index.blade.php',
              'resources/views/components/layouts/guest.blade.php',
              'resources/views/layouts/guest.blade.php',
              'resources/views/pages/contact.blade.php',
              'resources/views/pages/about.blade.php',
              'resources/views/pages/home.blade.php',
              'resources/views/pages/faq.blade.php',
              'resources/views/pages/how-it-works.blade.php',
              'resources/views/pages/marketplace/show.blade.php',
              'resources/views/emails/contact-inquiry.blade.php',
          ]
          files_to_sync = sorted(set(changed + core_sync))

          allowed_prefixes = (
              'app/',
              'bootstrap/',
              'config/',
              'database/migrations/',
              'database/seeders/',
              'lang/',
              'public/',
              'resources/',
              'routes/',
          )

          def ensure_remote_dir(ftp, path):
              parts = [p for p in path.split('/') if p]
              curr = ''
              for p in parts:
                  curr += '/' + p
                  try:
                      ftp.cwd(curr)
                  except Exception:
                      try:
                          ftp.mkd(curr)
                      except Exception:
                          pass

          try:
              ftp = ftplib.FTP()
              ftp.connect(host, 21, timeout=30)
              ftp.login(user, password)
              ftp.set_pasv(True)
              print(f"Connected to {host} as {user}, PWD={ftp.pwd()}")

              for rel_path in files_to_sync:
                  if not os.path.isfile(rel_path):
                      continue
                  if not rel_path.startswith(allowed_prefixes):
                      continue

                  remote_file = f"{remote_base}/{rel_path}"
                  ensure_remote_dir(ftp, os.path.dirname(remote_file))
                  with open(rel_path, 'rb') as f:
                      ftp.storbinary(f"STOR {remote_file}", f)
                  print(f"Uploaded: {remote_file}")

                  if rel_path.startswith('public/') and rel_path != 'public/index.php':
                      sub_path = rel_path[len('public/'):]
                      remote_pub_html = f"{remote_base}/public_html/{sub_path}"
                      ensure_remote_dir(ftp, os.path.dirname(remote_pub_html))
                      with open(rel_path, 'rb') as f:
                          ftp.storbinary(f"STOR {remote_pub_html}", f)
                      print(f"Uploaded: {remote_pub_html}")

              try:
                  ftp.cwd(f"{remote_base}/storage/framework/views")
                  cleared = 0
                  for name in ftp.nlst():
                      if name.endswith('.php'):
                          ftp.delete(name)
                          cleared += 1
                  print(f"Cleared {cleared} compiled Blade views on live server.")
              except Exception as e:
                  print(f"Note while clearing views: {e}")

              try:
                  import io
                  buf = io.BytesIO()
                  ftp.retrbinary(f"RETR {remote_base}/storage/logs/laravel.log", buf.write)
                  log_lines = buf.getvalue().decode('utf-8', errors='replace').splitlines()[-90:]
                  print("--- Recent laravel.log ---")
                  for line in log_lines:
                      print(line[:300])
              except Exception as e:
                  print(f"Note reading laravel.log: {e}")

              ftp.quit()
              print("DEPLOY SUCCESS")
          except Exception as e:
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: Publish deploy log to deploy-log branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy-log-temp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/deploy.log ./deploy.log
          git add deploy.log
          git commit -m "Update deploy log"
          git push -f origin deploy-log-temp:deploy-log
